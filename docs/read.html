      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

            "session": {"cells": [{"code_hash": "2cab78099bd636427406100deebd3495", "console": [], "id": "Hbol", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "9b165af562983bd9f3ff0338a6845b5a", "console": [], "id": "MJUe", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "950ab0254c9de140014c864e9dc1de1c", "console": [], "id": "vblA", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "f81781072b5e9098a1c4a444d6a2c941", "console": [], "id": "bkHC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"week-7-build-and-defend-an-end-to-end-project\"\u003EWeek 7: Build and defend an end-to-end project\u003C/h1\u003E\n\u003Cspan class=\"paragraph\"\u003EA full week of self-study, mapped to \u003Cstrong\u003ECapstone Project for AI Engineering\u003C/strong\u003E. Estimated \u003Cstrong\u003E20 active hours\u003C/strong\u003E, not an official contact-hour claim.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EIndependent reconstruction, not NUS-issued teaching material.\u003C/strong\u003E Published objectives are the anchor. Exercises, datasets and rubric are original.\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003EFrame a problem and measurable acceptance criteria\u003C/li\u003E\n\u003Cli\u003ECombine a predictor and retrieval helper with source tracing\u003C/li\u003E\n\u003Cli\u003ERun hold-out tests, inspect subgroup errors and present honest limits\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Ca href=\"https://www.comp.nus.edu.sg/executive-education/course/sctp-capstone-project-for-ai-engineering/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EOfficial objectives\u003C/a\u003E | \u003Ca href=\"https://github.com/azjhf-dev/nus-aie-week-07-capstone\" rel=\"noopener noreferrer\" target=\"_blank\"\u003ERepository\u003C/a\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EBoundary:\u003C/strong\u003E Assessment weights, expected capstone size, official datasets and marking rubrics are unpublished in the evidence inspected. The rubric supplied here is an original self-study rubric, not NUS's.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "5b656c82c81a3c4c869295509827e2ff", "console": [], "id": "lEQa", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"plan-your-week\"\u003EPlan your week\u003C/h2\u003E\n\u003Cul\u003E\n\u003Cli\u003EDay 1: scope, dataset card and evaluation plan (3h)\u003C/li\u003E\n\u003Cli\u003EDay 2: baseline pipeline and user interface (4h)\u003C/li\u003E\n\u003Cli\u003EDay 3: predictor plus retrieval integration (4h)\u003C/li\u003E\n\u003Cli\u003EDay 4: evaluation, incident drill and fairness caveats (4h)\u003C/li\u003E\n\u003Cli\u003EDay 5: clean rerun, report and five-minute demo (5h)\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EStart each lab by predicting the effect of a control. Change one variable, record the observation, then explain why. All default experiments need no key, no paid service and no private data. The hosted WASM viewer needs an internet connection to fetch its runtime and packages.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "e7dcf544d6e13bfb4f59f9c13e86467e", "console": [], "id": "PKri", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='PKri-0' random-id='75e3deee-ef55-e930-1ef6-9f737bcd210e'\u003E\u003Cmarimo-checkbox data-initial-value='true' data-label='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003ePlay conceptual motion graphic\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-disabled='false'\u003E\u003C/marimo-checkbox\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "d4b27ba3bd3dcc483c1e231fb6ec7206", "console": [], "id": "Xref", "outputs": [{"data": {"text/html": "\u003Cstyle\u003E@keyframes labPulse{0%,100%{opacity:.35}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.lab-pulse{animation:none!important}}\u003C/style\u003E\u003Csvg role=\"img\" aria-label=\"Animated conceptual data flow\" viewBox=\"0 0 400 235\" style=\"width:100%;height:auto\"\u003E\u003Ctitle\u003EConceptual data flow. Motion shows order, not measured time.\u003C/title\u003E\u003Cg class=\"lab-pulse\" style=\"animation:labPulse 3s 0.0s infinite\"\u003E\u003Crect x=\"8\" y=\"12\" width=\"180\" height=\"70\" rx=\"11\" fill=\"#12675c\"/\u003E\u003Ctext x=\"98\" y=\"54\" text-anchor=\"middle\" fill=\"white\" font-size=\"19\"\u003E1. Frame\u003C/text\u003E\u003C/g\u003E\u003Cg class=\"lab-pulse\" style=\"animation:labPulse 3s 0.45s infinite\"\u003E\u003Crect x=\"203\" y=\"12\" width=\"180\" height=\"70\" rx=\"11\" fill=\"#12675c\"/\u003E\u003Ctext x=\"293\" y=\"54\" text-anchor=\"middle\" fill=\"white\" font-size=\"19\"\u003E2. Build\u003C/text\u003E\u003C/g\u003E\u003Cg class=\"lab-pulse\" style=\"animation:labPulse 3s 0.9s infinite\"\u003E\u003Crect x=\"8\" y=\"110\" width=\"180\" height=\"70\" rx=\"11\" fill=\"#12675c\"/\u003E\u003Ctext x=\"98\" y=\"152\" text-anchor=\"middle\" fill=\"white\" font-size=\"19\"\u003E3. Test\u003C/text\u003E\u003C/g\u003E\u003Cg class=\"lab-pulse\" style=\"animation:labPulse 3s 1.35s infinite\"\u003E\u003Crect x=\"203\" y=\"110\" width=\"180\" height=\"70\" rx=\"11\" fill=\"#12675c\"/\u003E\u003Ctext x=\"293\" y=\"152\" text-anchor=\"middle\" fill=\"white\" font-size=\"19\"\u003E4. Defend\u003C/text\u003E\u003C/g\u003E\u003C/svg\u003E\u003Cp style=\"font:13px/1.4 system-ui;color:#567068\"\u003EConceptual sequence, not a measured timeline. Pause with the checkbox above.\u003C/p\u003E"}, "type": "data"}]}, {"code_hash": "211ef9f3892001d1b5c33529187cee53", "console": [], "id": "SFPL", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"01-define-the-acceptance-criterion-first\"\u003E01 | Define the acceptance criterion first\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EThe predictor uses a synthetic binary task. It is not a system for deciding what real pupils deserve. This integrated capstone combines numerical prediction, explicit error costs and an authored retrieval corpus.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "2a27baa686f0f05a0cf22481c578866f", "console": [], "id": "BYtC", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='BYtC-0' random-id='ebc1e818-5242-bacd-9828-a233fda51720'\u003E\u003Cmarimo-slider data-initial-value='0.5' data-label='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eIntervention threshold\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-start='0.1' data-stop='0.9' data-step='0.05' data-steps='[]' data-debounce='false' data-disabled='false' data-orientation='\u0026quot;horizontal\u0026quot;' data-show-value='false' data-include-input='false' data-full-width='false'\u003E\u003C/marimo-slider\u003E\u003C/marimo-ui-element\u003E\u003Cmarimo-ui-element object-id='BYtC-1' random-id='0bd07748-2d86-6acd-b610-9f72e6237e75'\u003E\u003Cmarimo-slider data-initial-value='0.8' data-label='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eProposed minimum recall\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-start='0.5' data-stop='1' data-step='0.05' data-steps='[]' data-debounce='false' data-disabled='false' data-orientation='\u0026quot;horizontal\u0026quot;' data-show-value='false' data-include-input='false' data-full-width='false'\u003E\u003C/marimo-slider\u003E\u003C/marimo-ui-element\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "fe0ccaa30cbb11b980a35ac889d92182", "console": [], "id": "RGSE", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Csection style=\"margin:12px 0;padding:14px;background:#f6f8f6;border-radius:12px\"\u003E\u003Cp style=\"font:600 15px/1.4 system-ui;margin:0 0 10px;color:#20332e\"\u003ECapstone evaluation on a separate seeded synthetic set\u003C/p\u003E\u003Csvg role=\"img\" aria-label=\"Capstone evaluation on a separate seeded synthetic set\" viewBox=\"0 0 400 144\" style=\"width:100%;height:auto\"\u003E\u003Ctitle\u003ECapstone evaluation on a separate seeded synthetic set\u003C/title\u003E\u003Ctext x=\"0\" y=\"22\" font-size=\"14\" fill=\"#20332e\"\u003Eprecision\u003C/text\u003E\u003Crect x=\"132\" y=\"4\" width=\"210.00\" height=\"25\" rx=\"4\" fill=\"#12675c\"/\u003E\u003Ctext x=\"347.00\" y=\"22\" font-size=\"14\" fill=\"#20332e\"\u003E0.894\u003C/text\u003E\u003Ctext x=\"0\" y=\"66\" font-size=\"14\" fill=\"#20332e\"\u003Erecall\u003C/text\u003E\u003Crect x=\"132\" y=\"48\" width=\"201.43\" height=\"25\" rx=\"4\" fill=\"#b56420\"/\u003E\u003Ctext x=\"338.43\" y=\"66\" font-size=\"14\" fill=\"#20332e\"\u003E0.857\u003C/text\u003E\u003Ctext x=\"0\" y=\"110\" font-size=\"14\" fill=\"#20332e\"\u003Eaccuracy\u003C/text\u003E\u003Crect x=\"132\" y=\"92\" width=\"203.67\" height=\"25\" rx=\"4\" fill=\"#7353a6\"/\u003E\u003Ctext x=\"340.67\" y=\"110\" font-size=\"14\" fill=\"#20332e\"\u003E0.867\u003C/text\u003E\u003C/svg\u003E\u003C/section\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003ERecall gate: \u003Cstrong\u003EPASS\u003C/strong\u003E. Interactive threshold tuning makes this a validation set. A final test must use a new locked seed and no further tuning.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "e358f5dec77027b11a53e14484282805", "console": [], "id": "Kclp", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"02-inspect-errors-across-synthetic-groups\"\u003E02 | Inspect errors across synthetic groups\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EGroups are alternating row labels, not protected attributes. The gap is a sampling illustration only. Small denominators can make a large-looking difference unstable; equal aggregate accuracy is not proof of fairness.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "af8154de6b8b5da9578a8270437e2db0", "console": [], "id": "emfo", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='emfo-0' random-id='2ff262c6-0b8a-91e2-ea08-eb7b0c1383a0'\u003E\u003Cmarimo-slider data-initial-value='20' data-label='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eMinimum group sample before reporting\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-start='5' data-stop='40' data-steps='[]' data-debounce='false' data-disabled='false' data-orientation='\u0026quot;horizontal\u0026quot;' data-show-value='false' data-include-input='false' data-full-width='false'\u003E\u003C/marimo-slider\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "1e93a r may be awkward but its evidence is inspectable. A real educational product would need privacy, safeguarding and pedagogical review.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "b1eb45b25d5eb7bc48cf5f58a6dd07d8", "console": [], "id": "iLit", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='iLit-0' random-id='f508bda5-7b5a-2323-6c20-2a80df4c83e6'\u003E\u003Cmarimo-text data-initial-value='\u0026quot;How can I validate training and test data?\u0026quot;' data-label='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eStudy-resource question\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-placeholder='\u0026quot;\u0026quot;' data-kind='\u0026quot;text\u0026quot;' data-full-width='true' data-disabled='false' data-debounce='true'\u003E\u003C/marimo-text\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "22fb8512dfd66f8d11e957ad42bbd2d7", "console": [], "id": "ZHCJ", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EResource helper:\u003C/strong\u003E [ML] Fit preprocessing on training data only. Keep a final test set separate from model selection. [DATA] NumPy supports numeric arrays. pandas can detect missing values and aggregate tabular records.\u003C/span\u003E\u003C/span\u003E\u003Cmarimo-ui-element object-id='ZHCJ-0' random-id='4fa79a82-94b4-112a-d934-40cedf228fa0'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='null' data-data='\u0026quot;[{\u0026#92;\u0026quot;id\u0026#92;\u0026quot;:\u0026#92;\u0026quot;ML\u0026#92;\u0026q LUATION.md, DEMO.md and an incident runbook. Present one success and two failures, then explain what would change the release decision.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003C/marimo-accordion\u003E"}, "type": "data"}]}, {"code_hash": "d42573e847880cba2b305c1869f387aa", "console": [], "id": "ulZA", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"evidence-and-next-depth\"\u003EEvidence and next depth\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EThese are \u003Cstrong\u003Eother NUS-ISS courses and projects\u003C/strong\u003E, not submissions from this exact SCTP programme. A public repository does not establish permission to copy everything in it. The research CSV records license and evidence depth.\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003Eanastasiapatricks/JobAId\u003C/code\u003E\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003ENUS-AIS-Practice-Modules/IRS-PM-2025-08-30-AIS11FT-GRP-NeverStopCoding-WhatsEat\u003C/code\u003E\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003Eatsui888/MTech-AI-Capstone-Project\u003C/code\u003E\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003EIRS-PM/Workshop-Project-Submission-Template\u003C/code\u003E\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003ESee \u003Ccode\u003ECURRICULUM.md\u003C/code\u003E, \u003Ccode\u003EASSESSMENT.md\u003C/code\u003E, \u003Ccode\u003ESOURCES.md\u003C/code\u003E and the portfolio files for more work. Real pretrained model training and live-service integrations are optional extensions, not things this notebook silently performs.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EChecked 19 November 2026. Record your own results; published student results are not reproduced here.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}], "metadata": {"marimo_version": "0.25.2", "script_metadata_hash": null}, "version": "1"},
