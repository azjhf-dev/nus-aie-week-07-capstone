    <script data-marimo="true">
      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

x/1.4 system-ui;margin:0 0 10px;color:#20332e\"\u003ELocked final synthetic evaluation\u003C/p\u003E\u003Csvg role=\"img\" aria-label=\"Locked final synthetic evaluation\" viewBox=\"0 0 400 144\" style=\"width:100%;height:auto\"\u003E\u003Ctitle\u003ELocked final synthetic evaluation\u003C/title\u003E\u003Ctext x=\"0\" y=\"22\" font-size=\"14\" fill=\"#20332e\"\u003Eaccuracy\u003C/text\u003E\u003Crect x=\"132\" y=\"4\" width=\"187.65\" height=\"25\" rx=\"4\" fill=\"#12675c\"/\u003E\u003Ctext x=\"324.65\" y=\"22\" font-size=\"14\" fill=\"#20332e\"\u003E0.850\u003C/text\u003E\u003Ctext x=\"0\" y=\"66\" font-size=\"14\" fill=\"#20332e\"\u003Eprecision\u003C/text\u003E\u003Crect x=\"132\" y=\"48\" width=\"175.71\" height=\"25\" rx=\"4\" fill=\"#b56420\"/\u003E\u003Ctext x=\"312.71\" y=\"66\" font-size=\"14\" fill=\"#20332e\"\u003E0.796\u003C/text\u003E\u003Ctext x=\"0\" y=\"110\" font-size=\"14\" fill=\"#20332e\"\u003Erecall\u003C/text\u003E\u003Crect x=\"132\" y=\"92\" width=\"210.00\" height=\"25\" rx=\"4\" fill=\"#7353a6\"/\u003E\u003Ctext x=\"347.00\" y=\"110\" font-size=\"14\" fill=\"#20332e\"\u003E0.951\u003C/text\u003E\u003C/svg\u003E\u003C/section\u003E\u003Cpre class='text-xs'\u003E{\n  \u0026quot;version\u0026quot;: \u0026quot;synthetic-logistic-v1\u0026quot;,\n  \u0026quot;weights\u0026quot;: [\n    0.1956480908325254,\n    2.2924471931180044,\n    1.4923434503547335\n  ],\n  \u0026quot;threshold\u0026quot;: 0.39999999999999997,\n  \u0026quot;training_rows\u0026quot;: 240,\n  \u0026quot;validation_rows\u0026quot;: 80,\n  \u0026quot;test_rows\u0026quot;: 80,\n  \u0026quot;seed\u0026quot;: 20261119\n}\u003C/pre\u003E\u003Cpre class='text-xs'\u003E{\n  \u0026quot;artifact_sha256\u0026quot;: \u0026quot;87c40dafd6a710144d566d1dd32ac8d28f62cad7ef2a5d85b105b0873fb6893a\u0026quot;,\n  \u0026quot;test\u0026quot;: {\n    \u0026quot;tp\u0026quot;: 39,\n    \u0026quot;fp\u0026quot;: 10,\n    \u0026quot;fn\u0026quot;: 2,\n    \u0026quot;tn\u0026quot;: 29,\n    \u0026quot;
